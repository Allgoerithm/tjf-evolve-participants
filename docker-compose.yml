# Single-node OpenSearch for the workshop demo. Security is disabled on
# purpose (local, demo-only): never expose this port beyond localhost.
services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: tjf-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
  dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    ports:
      - '127.0.0.1:5601:5601'
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:5601/api/status >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  dashboards-setup:
    image: opensearchproject/opensearch-dashboards:3.9.0
    entrypoint: ["/usr/share/opensearch-dashboards/node/bin/node"]
    command: ["/setup/dashboards-setup.mjs"]
    environment:
      DASHBOARDS_URL: http://dashboards:5601
    volumes:
      - ./docker/dashboards-setup.mjs:/setup/dashboards-setup.mjs:ro
    depends_on:
      dashboards:
        condition: service_healthy
    restart: "no"

volumes:
  opensearch-data:
